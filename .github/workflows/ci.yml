name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swift format lint --recursive --strict Package.swift Sources Tests
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./install.sh build
